name: Weekly Smoke Tests

# TB-12: weekly scheduled smoke-test run. The smoke suite shells out to the
# real `pi` binary and exercises the actual orchestrator paths. Trigger via
# Actions tab → "Weekly Smoke Tests" → Run workflow, OR let the cron run
# automatically Monday 9am UTC to catch regressions before they accumulate.
#
# NOTE: the smoke suite is split by credential need (F19 / RR-015).
#   - AUTH-FREE probes (test/smoke/argv-flags.smoke.ts) exercise the real `pi`
#     BINARY and its OPTION PARSER but never call a model. They are gated only
#     on PI_CREW_SMOKE=1 (see `binarySmokeSkipReason()` in test/smoke/_helpers.ts)
#     and therefore RUN in this credential-free canary. The dedicated
#     "Verify auth-free smoke probe ran" step below FAILS the job if that probe
#     is skipped, so the canary can never again report a green run that
#     executed nothing.
#   - LLM-BILLED smoke tests (agent-*.smoke.ts, dwf-workflow.smoke.ts) need a
#     resolvable model + API key (`smokeSkipReason()` → `MODEL_AUTH_AVAILABLE`)
#     and will report "skipped" here. Leave PI_AUTH_JSON unset to keep this a
#     free weekly canary; configure the repo secret to exercise them (they
#     bill tokens).
#
# Distinct from .github/workflows/smoke.yml (manual LLM-billed suite) and
# .github/workflows/ci.yml (per-PR push gate). This is the cheapest,
# fastest weekly canary that exercises the bundle + cold-start path.

on:
  schedule:
    - cron: '0 9 * * MON'  # Monday 9am UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PI_CREW_SMOKE: "1"

jobs:
  smoke:
    name: ubuntu-latest / Node 22
    runs-on: ubuntu-latest
    # Fail loud: if the bundle build or smoke step fails, surface it
    # immediately. No continue-on-error — this is the weekly canary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Print platform diagnostics
        run: |
          node -p "JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version, cwd: process.cwd() }, null, 2)"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        # Bundle must be present before the smoke suite runs because the
        # test harness loads dist/index.mjs, not src/.
        run: npm run build:bundle
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Verify auth-free smoke probe ran (not skipped)
        # F19 / RR-015 AC-17+AC-18: the argv/binary probe needs NO credentials,
        # so "skipped" here means the canary proved nothing. Assert on the TAP
        # summary of a fresh run of that single file: it must report at least
        # one PASSING test and ZERO skipped. This is what makes the canary's
        # green meaningful instead of vacuous.
        run: |
          node scripts/test-runner.mjs --test-concurrency=1 --test-timeout=180000 test/smoke/argv-flags.smoke.ts 2>&1 | tee /tmp/argv-smoke.tap
          PASS=$(sed -n 's/^# pass \([0-9]\+\).*/\1/p' /tmp/argv-smoke.tap | tail -1)
          SKIPPED=$(sed -n 's/^# skipped \([0-9]\+\).*/\1/p' /tmp/argv-smoke.tap | tail -1)
          echo "auth-free probe: pass=${PASS:-?} skipped=${SKIPPED:-?}"
          if [ "${PASS:-0}" -lt 1 ]; then
            echo "::error::the auth-free argv probe reported no passing tests — the canary proved nothing"
            exit 1
          fi
          if [ "${SKIPPED:-1}" -ne 0 ]; then
            echo "::error::the auth-free argv probe was SKIPPED (${SKIPPED}) — it must run without credentials"
            exit 1
          fi
      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-smoke-logs
          path: |
            test/smoke/*.log
            .crew/state/runs/team_smoke_*/
          if-no-files-found: ignore
          retention-days: 14
